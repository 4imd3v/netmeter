name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - name: Resolve and validate release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$PUSH_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "error: tag must start with v and contain only letters, numbers, dots, and hyphens: $tag" >&2
            exit 1
          fi
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$package_version" != "${tag#v}" ]; then
            echo "error: Cargo.toml version $package_version does not match release tag $tag" >&2
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify static
        run: |
          file target/${{ matrix.target }}/release/netmeter
          # ldd exits non-zero for static binaries; capture regardless
          ldd target/${{ matrix.target }}/release/netmeter > ldd.txt 2>&1 || true
          cat ldd.txt
          if grep -Eq 'not a dynamic executable|statically linked' ldd.txt; then
            echo "static binary verified"
          else
            echo "error: binary is not statically linked" >&2
            exit 1
          fi
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/netmeter dist/netmeter
          cp LICENSE-MIT README.md dist/
          tar -czf netmeter-${{ matrix.target }}.tar.gz -C dist .
          sha256sum netmeter-${{ matrix.target }}.tar.gz > netmeter-${{ matrix.target }}.sha256
      - name: Verify package
        run: |
          sha256sum -c netmeter-${{ matrix.target }}.sha256
          rm -rf verify
          mkdir verify
          tar -xzf netmeter-${{ matrix.target }}.tar.gz -C verify
          test -x verify/netmeter
          verify/netmeter --version
          verify/netmeter manpage >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            netmeter-*.tar.gz
            netmeter-*.sha256

  smoke-test:
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: artifacts
      - name: Assemble local checksum file
        run: |
          cd artifacts
          sha256sum netmeter-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Install packaged binary
        env:
          INSTALL_PREFIX: ${{ runner.temp }}/netmeter-smoke/bin
          NETMETER_INSTALL_BASE: file://${{ github.workspace }}/artifacts
          XDG_DATA_HOME: ${{ runner.temp }}/netmeter-smoke/data
        run: |
          sh install.sh --user --no-daemon --version "$RELEASE_TAG" --prefix "$INSTALL_PREFIX"
          "$INSTALL_PREFIX/netmeter" --version
          "$INSTALL_PREFIX/netmeter" manpage >/dev/null

  release:
    needs: [validate, smoke-test]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble checksums
        run: |
          cd artifacts
          sha256sum netmeter-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release..."
            gh release upload "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              artifacts/*
          else
            gh release create "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              artifacts/*
          fi

  publish-crates:
    needs: [validate, release]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Publish to crates.io (skipped when no token)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(printf '%s' "$metadata" | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["name"])')"
          crate_version="$(printf '%s' "$metadata" | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${crate_name}/${crate_version}")"
          case "$status" in
            200)
              echo "${crate_name} ${crate_version} is already published; skipping"
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "error: could not check crates.io for ${crate_name} ${crate_version} (HTTP $status)" >&2
              exit 1
              ;;
          esac

  packages:
    # Runs after the binary release so a packaging failure can't block it.
    needs: [validate, release]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - name: Build .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            target/debian/*.deb target/generate-rpm/*.rpm
