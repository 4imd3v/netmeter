name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify static
        run: |
          file target/${{ matrix.target }}/release/netmeter
          # ldd exits non-zero for static binaries; capture regardless
          ldd target/${{ matrix.target }}/release/netmeter > ldd.txt 2>&1 || true
          cat ldd.txt
          grep -q 'not a dynamic executable' ldd.txt
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/netmeter dist/netmeter
          cp LICENSE-MIT README.md dist/
          tar -czf netmeter-${{ matrix.target }}.tar.gz -C dist .
          sha256sum netmeter-${{ matrix.target }}.tar.gz > netmeter-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            netmeter-*.tar.gz
            netmeter-*.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble checksums
        run: |
          cd artifacts
          sha256sum netmeter-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*

  publish-crates:
    needs: build
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish to crates.io (skipped when no token)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked

  packages:
    # Runs after the binary release so a packaging failure can't block it.
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - name: Build .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            target/debian/*.deb target/generate-rpm/*.rpm
