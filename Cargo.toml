[package]
name = "netmeter"
version = "0.2.0"
edition = "2021"
description = "Local-first LAN/WAN/TOTAL bandwidth meter for Linux"
license = "MIT"

[[bin]]
name = "netmeter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
jiff = { version = "0.2", features = ["std"] }
anyhow = "1"
libc = "0.2"
pnet = { version = "0.35", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true

[package.metadata.deb]
maintainer = "NetMeter contributors"
copyright = "2026, NetMeter contributors (MIT)"
license-file = ["LICENSE-MIT", "4"]
section = "net"
priority = "optional"
depends = "systemd"
recommends = "nftables, libnotify-bin"
conf-files = ["/etc/netmeter/config.toml"]
maintainer-scripts = "packaging/debian/"
extended-description = """\
Local-first LAN/WAN/TOTAL bandwidth meter for Linux. \
Kernel counters only, background daemon, terminal dashboard."""
assets = [
  ["target/release/netmeter", "usr/bin/", "755"],
  ["packaging/netmeter.service", "lib/systemd/system/", "644"],
  ["packaging/netmeter-agent.service", "usr/share/netmeter/user/", "644"],
  ["packaging/config.toml.example", "etc/netmeter/config.toml", "644"],
  ["man/netmeter.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/netmeter", dest = "/usr/bin/netmeter", mode = "755" },
  { source = "packaging/netmeter.service", dest = "/lib/systemd/system/netmeter.service", mode = "644" },
  { source = "packaging/netmeter-agent.service", dest = "/usr/share/netmeter/user/netmeter-agent.service", mode = "644" },
  { source = "packaging/config.toml.example", dest = "/etc/netmeter/config.toml", mode = "644", config = true },
  { source = "man/netmeter.1", dest = "/usr/share/man/man1/netmeter.1", mode = "644" },
]
post-install-script = "packaging/rpm-postinst"
