[package]
name = "netmeter"
version = "0.1.0"
edition = "2021"
description = "Local-first LAN/WAN/TOTAL bandwidth meter for Linux"
license = "MIT"

[[bin]]
name = "netmeter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
jiff = { version = "0.2", features = ["std"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
